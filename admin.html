<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xenow Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        <!-- Header -->
        <header class="flex flex-wrap justify-between items-center mb-6 bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
            <div class="flex items-center space-x-3 mb-3 sm:mb-0">
                <div class="bg-blue-600 text-white font-bold px-3 py-2 rounded-lg text-lg">XW</div>
                <h1 class="text-xl font-bold">Xenow Admin Panel</h1>
            </div>
            <nav class="flex space-x-2">
                <button onclick="switchTab('create')" id="tab-btn-create" class="px-4 py-2 rounded-lg font-medium bg-blue-600 text-white transition">Tạo Bài Viết</button>
                <button onclick="switchTab('bulk')" id="tab-btn-bulk" class="px-4 py-2 rounded-lg font-medium bg-slate-700 text-slate-300 hover:bg-slate-600 transition">Cập Nhật 8 Bài Cũ</button>
                <button onclick="switchTab('settings')" id="tab-btn-settings" class="px-4 py-2 rounded-lg font-medium bg-slate-700 text-slate-300 hover:bg-slate-600 transition">Cấu Hình</button>
            </nav>
        </header>

        <!-- Tab: Tạo Bài Viết -->
        <section id="tab-create" class="space-y-4 bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
            <h2 class="text-lg font-semibold text-blue-400">✍️ Soạn và Đăng Bài Viết Mới</h2>
            <div>
                <label class="block text-sm font-medium mb-1">Tiêu Đề Bài Viết (Title)</label>
                <input type="text" id="post-title" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="Nhập tiêu đề bài viết...">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Đường Dẫn URL (Slug)</label>
                <input type="text" id="post-slug" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="duong-dan-bai-viet (tự động tạo từ tiêu đề)">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Mô Tả Ngắn (Excerpt)</label>
                    <textarea id="post-excerpt" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="Tóm tắt ngắn gọn cho SEO..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Từ Khóa SEO (Keywords)</label>
                    <input type="text" id="post-keywords" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="thuê xe, sài gòn vũng tàu...">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Nội Dung Chi Tiết (Markdown)</label>
                <textarea id="post-content" rows="8" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white font-mono text-sm focus:outline-none focus:border-blue-500" placeholder="Nhập nội dung bài viết bằng định dạng Markdown..."></textarea>
            </div>
            <button onclick="publishPost()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg shadow transition">🚀 Đăng Bài Lên GitHub & Vercel</button>
            <div id="create-status" class="text-sm font-medium"></div>
        </section>

        <!-- Tab: Cập Nhật 8 Bài Cũ -->
        <section id="tab-bulk" class="hidden space-y-4 bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
            <h2 class="text-lg font-semibold text-blue-400">🔄 Tối Ưu & Cập Nhật Hàng Loạt Bài Cũ</h2>
            <p class="text-sm text-slate-400">Tính năng này giúp quét và cập nhật lại toàn bộ các bài viết cũ trong thư mục content/posts cho chuẩn SEO.</p>
            <button onclick="runBulkUpdate()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg shadow transition">Chạy Cập Nhật Hàng Loạt</button>
            <div id="bulk-status" class="text-sm font-medium"></div>
        </section>

        <!-- Tab: Cấu Hình -->
        <section id="tab-settings" class="hidden space-y-4 bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
            <h2 class="text-lg font-semibold text-blue-400">⚙️ Cấu Hình GitHub Kết Nối Trực Tiếp</h2>
            <div>
                <label class="block text-sm font-medium mb-1">GITHUB PERSONAL ACCESS TOKEN (PAT)</label>
                <input type="password" id="cfg-token" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="ghp_...">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">CHỦ SỞ HỮU (OWNER)</label>
                    <input type="text" id="cfg-owner" value="ththie" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">TÊN KHO (REPO)</label>
                    <input type="text" id="cfg-repo" value="xe-gia-re" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">NHÁNH (BRANCH)</label>
                    <input type="text" id="cfg-branch" value="main" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">THƯ MỤC (FOLDER)</label>
                    <input type="text" id="cfg-folder" value="content/posts" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="flex space-x-3 pt-2">
                <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg shadow transition">Lưu Cấu Hình</button>
                <button onclick="testConnection()" class="bg-slate-700 hover:bg-slate-600 text-white font-medium px-5 py-2.5 rounded-lg shadow transition">Kiểm Tra Kết Nối</button>
            </div>
            <div id="settings-status" class="text-sm font-medium"></div>
        </section>
    </div>

    <script>
        // Tự động sinh slug từ tiêu đề
        document.getElementById('post-title').addEventListener('input', function() {
            let title = this.value;
            let slug = title.toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[đĐ]/g, 'd')
                .replace(/([^0-9a-z-\s])/g, '')
                .replace(/(\s+)/g, '-')
                .replace(/-+/g, '-');
            document.getElementById('post-slug').value = slug;
        });

        function switchTab(tabName) {
            ['create', 'bulk', 'settings'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('tab-btn-' + t).className = "px-4 py-2 rounded-lg font-medium bg-slate-700 text-slate-300 hover:bg-slate-600 transition";
            });
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            document.getElementById('tab-btn-' + tabName).className = "px-4 py-2 rounded-lg font-medium bg-blue-600 text-white transition";
        }

        // Load config khi mở trang
        window.onload = function() {
            document.getElementById('cfg-token').value = localStorage.getItem('gh_token') || '';
            document.getElementById('cfg-owner').value = localStorage.getItem('gh_owner') || 'ththie';
            document.getElementById('cfg-repo').value = localStorage.getItem('gh_repo') || 'xe-gia-re';
            document.getElementById('cfg-branch').value = localStorage.getItem('gh_branch') || 'main';
            document.getElementById('cfg-folder').value = localStorage.getItem('gh_folder') || 'content/posts';
        };

        function saveSettings() {
            localStorage.setItem('gh_token', document.getElementById('cfg-token').value.trim());
            localStorage.setItem('gh_owner', document.getElementById('cfg-owner').value.trim());
            localStorage.setItem('gh_repo', document.getElementById('cfg-repo').value.trim());
            localStorage.setItem('gh_branch', document.getElementById('cfg-branch').value.trim());
            localStorage.setItem('gh_folder', document.getElementById('cfg-folder').value.trim());
            
            let status = document.getElementById('settings-status');
            status.className = "text-sm font-medium text-green-400";
            status.innerText = "Đã lưu cấu hình thành công!";
        }

        async function testConnection() {
            saveSettings();
            let token = localStorage.getItem('gh_token');
            let owner = localStorage.getItem('gh_owner');
            let repo = localStorage.getItem('gh_repo');
            let status = document.getElementById('settings-status');
            
            if (!token) {
                status.className = "text-sm font-medium text-red-400";
                status.innerText = "Vui lòng nhập Token!";
                return;
            }

            status.className = "text-sm font-medium text-yellow-400";
            status.innerText = "Đang kiểm tra kết nối...";

            try {
                let res = await fetch(`https://api.github.com/repos/${owner}/${repo}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (res.ok) {
                    status.className = "text-sm font-medium text-green-400";
                    status.innerText = "Kết nối GitHub thành công!";
                } else {
                    status.className = "text-sm font-medium text-red-400";
                    status.innerText = "Lỗi kết nối: Sai Token hoặc không có quyền truy cập repo!";
                }
            } catch (err) {
                status.className = "text-sm font-medium text-red-400";
                status.innerText = "Lỗi mạng hoặc bị chặn CORS!";
            }
        }

        async function publishPost() {
            saveSettings();
            let token = localStorage.getItem('gh_token');
            let owner = localStorage.getItem('gh_owner');
            let repo = localStorage.getItem('gh_repo');
            let branch = localStorage.getItem('gh_branch');
            let folder = localStorage.getItem('gh_folder');
            
            let title = document.getElementById('post-title').value.trim();
            let slug = document.getElementById('post-slug').value.trim();
            let excerpt = document.getElementById('post-excerpt').value.trim();
            let keywords = document.getElementById('post-keywords').value.trim();
            let content = document.getElementById('post-content').value.trim();
            let statusEl = document.getElementById('create-status');

            if (!token) {
                switchTab('settings');
                alert("Vui lòng vào phần Cấu Hình để nhập thông tin GitHub trước!");
                return;
            }
            if (!title || !slug) {
                statusEl.className = "text-sm font-medium text-red-400";
                statusEl.innerText = "Vui lòng điền tiêu đề và đường dẫn (slug)!";
                return;
            }

            statusEl.className = "text-sm font-medium text-yellow-400";
            statusEl.innerText = "Đang đẩy bài viết lên GitHub...";

            let filename = `${slug}.md`;
            let path = `${folder}/${filename}`;
            let dateStr = new Date().toISOString().split('T')[0];

            let markdownContent = `---
title: "${title}"
date: "${dateStr}"
description: "${excerpt}"
keywords: "${keywords}"
---

${content}`;

            let contentEncoded = btoa(unescape(encodeURIComponent(markdownContent)));

            try {
                // Kiểm tra xem file đã tồn tại chưa để lấy sha (tránh lỗi conflict khi update)
                let sha = '';
                let checkRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (checkRes.ok) {
                    let fileData = await checkRes.json();
                    sha = fileData.sha;
                }

                let bodyData = {
                    message: `Admin: Create/Update post ${filename}`,
                    content: contentEncoded,
                    branch: branch
                };
                if (sha) bodyData.sha = sha;

                let res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bodyData)
                });

                if (res.ok) {
                    statusEl.className = "text-sm font-medium text-green-400";
                    statusEl.innerText = "🎉 Đăng bài thành công! Vercel đang tự động cập nhật website...";
                } else {
                    let errJson = await res.json();
                    statusEl.className = "text-sm font-medium text-red-400";
                    statusEl.innerText = "Lỗi từ GitHub: " + (errJson.message || 'Không rõ nguyên nhân');
                }
            } catch (err) {
                statusEl.className = "text-sm font-medium text-red-400";
                statusEl.innerText = "Lỗi kết nối mạng: " + err.message;
            }
        }

        function runBulkUpdate() {
            let status = document.getElementById('bulk-status');
            status.className = "text-sm font-medium text-yellow-400";
            status.innerText = "Tính năng cập nhật hàng loạt đang sẵn sàng. Hãy đảm bảo cấu hình GitHub đã lưu.";
        }
    </script>
</body>
</html>
