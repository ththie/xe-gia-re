<!DOCTYPE html>
<html lang="vi"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xenow Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    <style>
        .ql-toolbar.ql-snow { background-color: #334155; border-color: #475569; border-top-left-radius: 0.5rem; border-top-right-radius: 0.5rem; }
        .ql-container.ql-snow { background-color: #0f172a; color: #f8fafc; border-color: #475569; border-bottom-left-radius: 0.5rem; border-bottom-right-radius: 0.5rem; font-size: 1rem; min-height: 250px; }
        .ql-snow .ql-stroke { stroke: #cbd5e1; }
        .ql-snow .ql-fill { fill: #cbd5e1; }
        .ql-snow .ql-picker { color: #cbd5e1; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        <!-- Header -->
        <header class="flex flex-wrap justify-between items-center mb-6 bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
            <div class="flex items-center space-x-3 mb-3 sm:mb-0">
                <div class="bg-blue-600 text-white font-bold px-3 py-2 rounded-lg text-lg">XW</div>
                <h1 class="text-xl font-bold">Xenow Admin Panel</h1>
            </div>
            <nav class="flex flex-wrap gap-2">
                <button onclick="switchTab('create')" id="tab-btn-create" class="px-3.5 py-2 rounded-lg font-medium bg-blue-600 text-white transition">Tạo Bài Mới</button>
                <button onclick="switchTab('edit-list')" id="tab-btn-edit-list" class="px-3.5 py-2 rounded-lg font-medium bg-slate-700 text-slate-300 hover:bg-slate-600 transition">Sửa Bài Cũ</button>
                <button onclick="switchTab('settings')" id="tab-btn-settings" class="px-3.5 py-2 rounded-lg font-medium bg-slate-700 text-slate-300 hover:bg-slate-600 transition">Cấu Hình</button>
            </nav>
        </header>

        <!-- Tab: Tạo Bài Viết -->
        <section id="tab-create" class="space-y-4 bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
            <h2 id="form-heading" class="text-lg font-semibold text-blue-400">✍️ Soạn và Đăng Bài Viết Mới</h2>
            <input type="hidden" id="edit-filename" value="">
            <div>
                <label class="block text-sm font-medium mb-1">Tiêu Đề Bài Viết (Title)</label>
                <input type="text" id="post-title" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="Nhập tiêu đề bài viết...">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Đường Dẫn URL (Slug - Tên file)</label>
                    <input type="text" id="post-slug" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="duong-dan-bai-viet">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Ngày Đăng Bài (Date)</label>
                    <input type="date" id="post-date" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Ảnh Đại Diện (Image URL)</label>
                    <div class="flex space-x-2">
                        <input type="text" id="post-image" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="https://...">
                        <button type="button" onclick="document.getElementById('thumbnail-file-input').click()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2.5 rounded-lg text-sm font-medium shrink-0 transition">📁 Chọn Ảnh</button>
                        <input type="file" id="thumbnail-file-input" accept="image/*" class="hidden" onchange="uploadThumbnail(this)">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Trạng Thái Bài Viết</label>
                    <div class="flex items-center space-x-3 mt-2.5">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="post-featured" class="w-4 h-4 text-blue-600 bg-slate-900 border-slate-700 rounded focus:ring-blue-500">
                            <span class="text-sm font-medium text-slate-200">📌 Ghim bài viết này (Featured)</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Mô Tả Ngắn (Excerpt)</label>
                    <textarea id="post-excerpt" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="Tóm tắt ngắn gọn..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Từ Khóa SEO (Keywords)</label>
                    <input type="text" id="post-keywords" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="thuê xe, sài gòn...">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Nội Dung Chi Tiết (Trực Quan)</label>
                <div id="editor-container"></div>
            </div>
            <div class="flex space-x-3">
                <button onclick="publishPost()" id="btn-submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg shadow transition">🚀 Đăng Bài Lên GitHub</button>
                <button onclick="resetForm()" id="btn-cancel-edit" class="hidden px-5 bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-lg shadow transition">Hủy Sửa</button>
            </div>
            <div id="create-status" class="text-sm font-medium"></div>
        </section>

        <!-- Tab: Danh Sách Sửa Bài Cũ -->
        <section id="tab-edit-list" class="hidden space-y-4 bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold text-blue-400">📝 Danh Sách Bài Viết Đã Đăng</h2>
                <button onclick="loadArticlesList()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-1.5 rounded-lg transition">🔄 Tải Lại Danh Sách</button>
            </div>
            <p class="text-sm text-slate-400">Bấm vào nút "Chỉnh Sửa" ở bài viết bất kỳ để nạp nội dung lên form và cập nhật ngay lập tức.</p>
            <div id="articles-container" class="space-y-2.5 max-h-[500px] overflow-y-auto pr-1">
                <p class="text-sm text-slate-500">Chưa tải danh sách. Vui lòng bấm "Tải Lại Danh Sách" hoặc chuyển qua tab này.</p>
            </div>
        </section>

        <!-- Tab: Cấu Hình -->
        <section id="tab-settings" class="hidden space-y-4 bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
            <h2 class="text-lg font-semibold text-blue-400">⚙️ Cấu Hình GitHub</h2>
            <div>
                <label class="block text-sm font-medium mb-1">GITHUB PERSONAL ACCESS TOKEN (PAT)</label>
                <input type="password" id="cfg-token" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="ghp_...">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">CHỦ SỞ HỮU (OWNER)</label>
                    <input type="text" id="cfg-owner" value="ththie" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">TÊN KHO (REPO)</label>
                    <input type="text" id="cfg-repo" value="xe-gia-re" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">NHÁNH (BRANCH)</label>
                    <input type="text" id="cfg-branch" value="main" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">THƯ MỤC (FOLDER)</label>
                    <input type="text" id="cfg-folder" value="content" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="flex space-x-3 pt-2">
                <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg shadow transition">Lưu Cấu Hình</button>
                <button onclick="testConnection()" class="bg-slate-700 hover:bg-slate-600 text-white font-medium px-5 py-2.5 rounded-lg shadow transition">Kiểm Tra Kết Nối</button>
            </div>
            <div id="settings-status" class="text-sm font-medium"></div>
        </section>
    </div>

    <!-- Nhúng Quill Editor -->
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <script>
        const quill = new Quill('#editor-container', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ header: [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    ['link', 'image'],
                    [{ list: 'ordered' }, { list: 'bullet' }],
                    [{ align: [] }],
                    ['clean']
                ]
            }
        });

        // Tự động sinh slug nếu đang tạo bài mới
        document.getElementById('post-title').addEventListener('input', function() {
            if (document.getElementById('edit-filename').value) return;
            let title = this.value;
            let slug = title.toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[đĐ]/g, 'd')
                .replace(/([^0-9a-z-\s])/g, '')
                .replace(/(\s+)/g, '-')
                .replace(/-+/g, '-');
            document.getElementById('post-slug').value = slug;
        });

        function switchTab(tabName) {
            ['create', 'edit-list', 'settings'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('tab-btn-' + t).className = "px-3.5 py-2 rounded-lg font-medium bg-slate-700 text-slate-300 hover:bg-slate-600 transition";
            });
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            document.getElementById('tab-btn-' + tabName).className = "px-3.5 py-2 rounded-lg font-medium bg-blue-600 text-white transition";
            
            if (tabName === 'edit-list') {
                loadArticlesList();
            }
        }

        window.onload = function() {
            document.getElementById('cfg-token').value = localStorage.getItem('gh_token') || '';
            document.getElementById('cfg-owner').value = localStorage.getItem('gh_owner') || 'ththie';
            document.getElementById('cfg-repo').value = localStorage.getItem('gh_repo') || 'xe-gia-re';
            document.getElementById('cfg-branch').value = localStorage.getItem('gh_branch') || 'main';
            document.getElementById('cfg-folder').value = localStorage.getItem('gh_folder') || 'content';
            
            document.getElementById('post-date').value = new Date().toISOString().slice(0, 10);
        };

        function saveSettings() {
            localStorage.setItem('gh_token', document.getElementById('cfg-token').value.trim());
            localStorage.setItem('gh_owner', document.getElementById('cfg-owner').value.trim());
            localStorage.setItem('gh_repo', document.getElementById('cfg-repo').value.trim());
            localStorage.setItem('gh_branch', document.getElementById('cfg-branch').value.trim());
            localStorage.setItem('gh_folder', document.getElementById('cfg-folder').value.trim());
        }

        async function testConnection() {
            saveSettings();
            let token = localStorage.getItem('gh_token');
            let owner = localStorage.getItem('gh_owner');
            let repo = localStorage.getItem('gh_repo');
            let status = document.getElementById('settings-status');
            
            if (!token) {
                status.className = "text-sm font-medium text-red-400";
                status.innerText = "Vui lòng nhập Token!";
                return;
            }

            status.className = "text-sm font-medium text-yellow-400";
            status.innerText = "Đang kiểm tra kết nối...";

            try {
                let res = await fetch(`https://api.github.com/repos/${owner}/${repo}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (res.ok) {
                    status.className = "text-sm font-medium text-green-400";
                    status.innerText = "Kết nối GitHub thành công!";
                } else {
                    status.className = "text-sm font-medium text-red-400";
                    status.innerText = "Lỗi kết nối: Sai Token hoặc sai tên kho!";
                }
            } catch (err) {
                status.className = "text-sm font-medium text-red-400";
                status.innerText = "Lỗi mạng!";
            }
        }

        async function loadArticlesList() {
            saveSettings();
            let token = localStorage.getItem('gh_token');
            let owner = localStorage.getItem('gh_owner');
            let repo = localStorage.getItem('gh_repo');
            let branch = localStorage.getItem('gh_branch');
            let folder = localStorage.getItem('gh_folder') || 'content';
            let container = document.getElementById('articles-container');

            if (!token) {
                container.innerHTML = "<p class='text-sm text-red-400'>Vui lòng nhập Token ở phần Cấu Hình trước!</p>";
                return;
            }

            container.innerHTML = "<p class='text-sm text-yellow-400'>Đang tải danh sách bài viết...</p>";

            try {
                let res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${folder}?ref=${branch}`, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (!res.ok) throw new Error("Không thể đọc thư mục bài viết");

                let files = await res.json();
                let mdFiles = files.filter(f => f.name.endsWith('.md')).sort().reverse();

                if (mdFiles.length === 0) {
                    container.innerHTML = "<p class='text-sm text-slate-400'>Chưa có bài viết nào trong thư mục.</p>";
                    return;
                }

                let html = '';
                for (let file of mdFiles) {
                    html += `
                        <div class="flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-700 hover:border-blue-500 transition">
                            <div class="truncate mr-3">
                                <p class="text-sm font-semibold text-slate-200 truncate">${file.name}</p>
                            </div>
                            <button onclick="editArticle('${file.path}', '${file.name}')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded font-medium shrink-0 transition">✏️ Chỉnh Sửa</button>
                        </div>
                    `;
                }
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p class='text-sm text-red-400'>Lỗi tải danh sách: ${err.message}</p>`;
            }
        }

        // Xử lý upload ảnh độc lập, không bị kẹt hay dính ô input
        async function uploadThumbnail(input) {
            if (!input.files || !input.files[0]) return;
            let file = input.files[0];
            let token = localStorage.getItem('gh_token');
            let owner = localStorage.getItem('gh_owner');
            let repo = localStorage.getItem('gh_repo');
            let branch = localStorage.getItem('gh_branch');
            let statusEl = document.getElementById('create-status');

            if (!token) {
                alert("Vui lòng cấu hình GitHub Token trước khi tải ảnh!");
                return;
            }

            statusEl.className = "text-sm font-medium text-yellow-400";
            statusEl.innerText = "Đang tải ảnh lên GitHub...";

            let reader = new FileReader();
            reader.onload = async function(e) {
                let base64Content = e.target.result.split(',')[1];
                let fileExt = file.name.split('.').pop();
                let fileName = 'public/images/uploads/' + Date.now() + '-' + Math.random().toString(36).substring(2, 7) + '.' + fileExt;

                try {
                    let res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${fileName}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: "Upload thumbnail " + fileName,
                            content: base64Content,
                            branch: branch
                        })
                    });

                    if (!res.ok) throw new Error("Lỗi tải ảnh lên GitHub");
                    
                    let rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${fileName}`;
                    let imageInput = document.getElementById('post-image');
                    imageInput.value = rawUrl;
                    imageInput.disabled = false;

                    statusEl.className = "text-sm font-medium text-green-400";
                    statusEl.innerText = "Tải ảnh thành công!";
                } catch (err) {
                    statusEl.className = "text-sm font-medium text-red-400";
                    statusEl.innerText = "Lỗi upload ảnh: " + err.message;
                }
            };
            reader.readAsDataURL(file);
        }

        async function editArticle(path, filename) {
            let token = localStorage.getItem('gh_token');
            let owner = localStorage.getItem('gh_owner');
            let repo = localStorage.getItem('gh_repo');
            let branch = localStorage.getItem('gh_branch');

            let statusEl = document.getElementById('create-status');
            statusEl.className = "text-sm font-medium text-yellow-400";
            statusEl.innerText = `Đang tải nội dung file ${filename}...`;

            try {
                let res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (!res.ok) throw new Error("Không tải được nội dung file");

                let fileData = await res.json();
                let content = decodeURIComponent(escape(atob(fileData.content)));

                let parts = content.split('---');
                if (parts.length >= 3) {
                    let frontmatter = parts[1];
                    let bodyHtml = parts.slice(2).join('---').trim();

                    let titleMatch = frontmatter.match(/title:\s*"([^"]*)"/);
                    let dateMatch = frontmatter.match(/date:\s*"([^"]*)"/);
                    let imageMatch = frontmatter.match(/image:\s*"([^"]*)"/);
                    let featuredMatch = frontmatter.match(/featured:\s*(true|false)/i);
                    let descMatch = frontmatter.match(/description:\s*"([^"]*)"/);
                    let kwMatch = frontmatter.match(/keywords:\s*"([^"]*)"/);

                    let imageInput = document.getElementById('post-image');
                    imageInput.value = imageMatch ? imageMatch[1] : '';
                    imageInput.disabled = false;

                    document.getElementById('post-title').value = titleMatch ? titleMatch[1] : '';
                    document.getElementById('post-slug').value = filename.replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/\.md$/, '');
                    document.getElementById('post-date').value = dateMatch ? dateMatch[1] : new Date().toISOString().slice(0, 10);
                    document.getElementById('post-featured').checked = featuredMatch ? (featuredMatch[1].toLowerCase() === 'true') : false;
                    document.getElementById('post-excerpt').value = descMatch ? descMatch[1] : '';
                    document.getElementById('post-keywords').value = kwMatch ? kwMatch[1] : '';
                    quill.root.innerHTML = bodyHtml;

                    document.getElementById('edit-filename').value = filename;

                    document.getElementById('form-heading').innerText = "✏️ Đang Chỉnh Sửa Bài Viết: " + filename;
                    document.getElementById('btn-submit').innerText = "💾 Lưu Lại Thay Đổi";
                    document.getElementById('btn-cancel-edit').classList.remove('hidden');

                    statusEl.innerText = "";
                    switchTab('create');
                } else {
                    throw new Error("Cấu trúc file Markdown không hợp lệ");
                }
            } catch (err) {
                statusEl.className = "text-sm font-medium text-red-400";
                statusEl.innerText = "Lỗi tải bài viết: " + err.message;
            }
        }

        function resetForm() {
            document.getElementById('edit-filename').value = '';
            document.getElementById('post-title').value = '';
            document.getElementById('post-slug').value = '';
            document.getElementById('post-date').value = new Date().toISOString().slice(0, 10);
            let imageInput = document.getElementById('post-image');
            imageInput.value = '';
            imageInput.disabled = false;
            document.getElementById('post-featured').checked = false;
            document.getElementById('post-excerpt').value = '';
            document.getElementById('post-keywords').value = '';
            quill.root.innerHTML = '';

            document.getElementById('form-heading').innerText = "✍️ Soạn và Đăng Bài Viết Mới";
            document.getElementById('btn-submit').innerText = "🚀 Đăng Bài Lên GitHub";
            document.getElementById('btn-cancel-edit').classList.add('hidden');
            document.getElementById('create-status').innerText = "";
        }

        async function publishPost() {
            saveSettings();
            let token = localStorage.getItem('gh_token');
            let owner = localStorage.getItem('gh_owner');
            let repo = localStorage.getItem('gh_repo');
            let branch = localStorage.getItem('gh_branch');
            let folder = localStorage.getItem('gh_folder') || 'content';
            let statusEl = document.getElementById('create-status');

            let title = document.getElementById('post-title').value.trim();
            let slug = document.getElementById('post-slug').value.trim();
            let postDate = document.getElementById('post-date').value.trim() || new Date().toISOString().slice(0, 10);
            let image = document.getElementById('post-image').value.trim();
            let featured = document.getElementById('post-featured').checked;
            let description = document.getElementById('post-excerpt').value.trim();
            let keywords = document.getElementById('post-keywords').value.trim();
            let content = quill.root.innerHTML;
            let oldFilename = document.getElementById('edit-filename').value;

            if (!token || !owner || !repo) {
                statusEl.className = "text-sm font-medium text-red-400";
                statusEl.innerText = "Vui lòng cấu hình đầy đủ Token và GitHub trong tab Cấu Hình!";
                return;
            }

            if (!title || !slug) {
                statusEl.className = "text-sm font-medium text-red-400";
                statusEl.innerText = "Vui lòng nhập Tiêu đề và Slug!";
                return;
            }

            let filename = oldFilename ? oldFilename : `${postDate}-${slug}.md`;
            let path = `${folder}/${filename}`;

            let fileContent = `---
title: "${title}"
date: "${postDate}"
image: "${image}"
featured: ${featured}
description: "${description}"
keywords: "${keywords}"
---

${content}`;

            let base64Content = btoa(unescape(encodeURIComponent(fileContent)));
            statusEl.className = "text-sm font-medium text-yellow-400";
            statusEl.innerText = "Đang đồng bộ lên GitHub...";

            try {
                let sha = null;
                let getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (getRes.ok) {
                    let fileData = await getRes.json();
                    sha = fileData.sha;
                }

                if (oldFilename && oldFilename !== filename) {
                    let delRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${folder}/${oldFilename}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: "Delete old filename for rename", sha: sha, branch: branch })
                    });
                    if (delRes.ok) sha = null;
                }

                let putBody = {
                    message: oldFilename ? `Update post ${filename}` : `Create post ${filename}`,
                    content: base64Content,
                    branch: branch
                };
                if (sha) putBody.sha = sha;

                let finalPutRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(putBody)
                });

                if (!finalPutRes.ok) throw new Error("Không thể lưu bài viết lên GitHub");

                statusEl.className = "text-sm font-medium text-green-400";
                statusEl.innerText = "Đăng bài thành công tuyệt đối!";
                setTimeout(() => { resetForm(); switchTab('edit-list'); }, 1200);
            } catch (err) {
                statusEl.className = "text-sm font-medium text-red-400";
                statusEl.innerText = "Lỗi đăng bài: " + err.message;
            }
        }
    </script>
</body>
</html>
