backend:
  name: github
  repo: ththie/xe-gia-re
  branch: main
  base_url: https://decap-cms-oauth-provider-backend.vercel.app
  auth_endpoint: /api/v1/authorize

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "homepage"
    label: "Quản Lý Trang Chủ"
    files:
      - file: "content/homepage.json"
        label: "Cấu hình Banner & Chữ Chạy"
        name: "homepage_config"
        fields:
          - label: "Hình Banner Trang Chủ"
            name: "banner_url"
            widget: "image"
          - label: "Nội dung chữ chạy"
            name: "marquee"
            widget: "string"

  - name: "blog"
    label: "Bài viết SEO"
    folder: "content"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Ghim nổi bật"
        name: "isFeatured"
        widget: "boolean"
        default: false
        required: false
      - label: "Tiêu đề"
        name: "title"
        widget: "string"
      - label: "Ngày đăng"
        name: "date"
        widget: "datetime"
      - label: "Ảnh đại diện"
        name: "image"
        widget: "image"
      - label: "Mô tả ngắn"
        name: "description"
        widget: "text"
      - label: "Nội dung"
        name: "body"
        widget: "markdown"

 
