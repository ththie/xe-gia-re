backend:
  name: git-gateway
  branch: main

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Bài Viết & Tin Tức"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Tiêu đề", name: "title", widget: "string"}
      - {label: "Đường dẫn SEO", name: "slug", widget: "string"}
      - {label: "Mô tả SEO", name: "description", widget: "text"}
      - {label: "Ảnh đại diện", name: "image", widget: "image"}
      - {label: "Danh mục", name: "category", widget: "select", options: ["Dịch Vụ", "Tin Tức", "Chia Sẻ"]}
      - {label: "Ghim nổi bật", name: "featured", widget: "boolean", default: false}
      - {label: "Ngày đăng", name: "date", widget: "datetime"}
      - {label: "Nội dung", name: "body", widget: "markdown"}
