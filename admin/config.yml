backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "config"
    label: "Cấu hình"
    files:
      - file: "content/settings.md"
        label: "Thông tin chung"
        name: "settings"
        fields:
          - {label: "Tiêu đề", name: "title", widget: "string"}
