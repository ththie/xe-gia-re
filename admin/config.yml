backend:
  name: git-gateway
  branch: main
  

# Tích hợp Cloudinary lưu ảnh mây tự động
media_library:
  name: cloudinary
  config:
    cloud_name: zwn264iv
    default_transformations:
      - - fetch_format: auto
          quality: auto

collections:
  - name: "blog"
    label: "Bài Viết SEO"
    folder: "content"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Tiêu đề bài viết", name: "title", widget: "string" }
      - { label: "Ngày đăng", name: "date", widget: "datetime" }
      - { label: "Hình ảnh đại diện", name: "thumbnail", widget: "image" }
      - { label: "Mô tả ngắn (SEO)", name: "description", widget: "text" }
      - { label: "Nội dung bài viết", name: "body", widget: "markdown" }
