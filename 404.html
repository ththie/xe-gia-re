<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>XENOW.VN</title>
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
        l.pathname.slice(1).split('&').join('~and~') +
        (l.search ? '&q=' + l.search.slice(1).split('&').join('~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
