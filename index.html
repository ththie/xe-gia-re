<!-- === DÁN PHẦN NÀY VÀO Ô ĐIỂM ĐÓN & ĐIỂM ĐẾN === -->

<!-- Điểm đón (Icon Google Map màu xanh lá) -->
<label for="pickup-location" style="display: flex; align-items: center; gap: 6px; font-weight: bold; margin-bottom: 4px;">
  <span style="color: #28a745; font-size: 16px;">📍</span> Điểm đón (Xuất phát)
</label>
<input type="text" id="pickup-location" placeholder="Nhập địa chỉ đón cụ thể tại Sài Gòn / Tỉnh">

<!-- Điểm đến (Icon Google Map màu đỏ) -->
<label for="dropoff-location" style="display: flex; align-items: center; gap: 6px; font-weight: bold; margin-bottom: 4px; margin-top: 12px;">
  <span style="color: #dc3545; font-size: 16px;">📍</span> Điểm đến (Nơi cần tới)
</label>
<input type="text" id="dropoff-location" placeholder="Nhập địa chỉ điểm đến">


<!-- === DÁN PHẦN NÀY NGAY DƯỚI NÚT GỬI ZALO === -->

<!-- Dòng thông báo bảo mật có icon ổ khóa -->
<div class="privacy-note" style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 12px; font-size: 13px; color: #6c757d;">
  <span style="color: #28a745; font-size: 15px;">🔒</span>
  <span>Thông tin quý khách được <strong>bảo mật tuyệt đối an toàn</strong>.</span>
</div>
